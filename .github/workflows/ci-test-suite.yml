name: Pull Request Master Test Suite & Quality Gate

on:
  pull_request:
    branches:
      - main
      - release/*

jobs:
  test-suite:
    name: Run Master Test Suite (Unit & Integration Tests)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Validate Shell Scripts & POSIX Compliance
        run: |
          echo "🔍 Kontrollin shell skriptide sintaksit..."
          bash -n scripts/*.sh
          bash -n scripts/internal/*.sh
          bash -n tests/*.sh

      - name: 3. Run Master Integration Test Suite
        run: |
          echo "🚀 Käivitan Master Test Suite automaattestijat..."
          ./tests/test-all-components.sh
