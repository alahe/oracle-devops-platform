Täna peaks olema  hierahiline configuratsioon. 
1. Kõige kõrgemal tasemels on meil  blueprint. mida me oleme nimetanud .env 
1.1. Eel konfigureeritud Blueprint  asuvad config/blueprints/ 
2. On meil olema profiilid mis asuvad  config/profiles
- seal on kolm kataloogi  database, ords, web-ide
- puudu oleks nagu forms ja publisher aga kuna nad vajavad kindkasti andmebaasi siis on nad lisatud andmebaaside kataloogi. 
- samuti tuleb luua võimalus et publsher ja forms installeeritakse ettevõtte linux või windows serverisse.
- tekib küsimus, ORDS mis vajab samuti andmebaasi. ORDS kataloogis on viidatud oracle enda konteiner registrisse. Samuti peabcsaam ära määrata ettevõtte sisese serveri kuhu on plaanis installeerida või on installeeritud ords.
- lisaks tuleb arvestada et me soovime salvestada image nii eraldi formsi ja publisheri jaoks eraldi. Ka ühine kui nad asuvad ühes weblogicu  konteineris. Et kuidas programm peab tuvastama et milline image, mis blueprindile on juba olemas ja kuidas seda identifitseerida et seda saaks kasutada. Et kiirendada taastamist. Ja seda ka teiste konbinatsioonide mis meil täna on (võib olla on neid palju aga me peame praegu pakkuma sellsit lahednust et see võimaldaks ka sellist lahendust hallata)
- kui meil on olemas automaatika, et alati peale keskonna seadmist tehakse kas snapshot või image.  Kui selline on olemas (1. ketta peal või siis ettevõtte artifactoris) siis saab tuleb seda kasutada, kui ei olemas siis tuleb peale keskonna ülesseadist se kohalikku kettale luua . Selleks peab olema kuidagi identifitseeritud  image's. Samuti kui on olemas see image ketta peal peab olema võimalus see kustutada või käsitsi sundida seda uuesti looma. Protsess peab olema kasutajale võimalikult mugav

