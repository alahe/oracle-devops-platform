services:
  # ---------------------------------------------------------------------------
  # Dynamic Architecture Base Manifest
  # All active database and ORDS services (e.g. db-dev-full, db-publisher, etc.)
  # are generated 100% dynamically from .env & profiles into podman-compose.override.yml
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 3. Optional Local ORDS Container (macOS / Local Dev Only)
  #    Toodangus kasutatakse eraldi Linux serveris asuvat ORDS-i.
  #    Käivita Mac-is koos ORDS-iga: podman compose --profile dev-ords up -d
  # ---------------------------------------------------------------------------
  dev-ords:
    profiles:
      - dev-ords
    image: ${ORDS_CONTAINER_IMAGE:-container-registry.oracle.com/database/ords:latest}
    container_name: oracle-ords-dev
    ports:
      - "${ORDS_PORT:-8088}:8080"
      - "${ORDS_SSL_PORT:-8448}:8443"
    env_file:
      - .env
    entrypoint:
      - /usr/bin/docker-entrypoint.sh
    environment:
      - DBHOST=db-apex-proxy
      - DBPORT=1521
      - DBSERVICENAME=FREEPDB1
    secrets:
      - apex_db_sys_password
      - ords_listener_password

    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    volumes:
      - apex_images:/opt/ords/apex
      - ./config/certs:/etc/ords/certs:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Standalone Containerized ORDS Service (Profile: standalone-ords)
  # ---------------------------------------------------------------------------
  ords-standalone:
    profiles:
      - standalone-ords
    image: ${ORDS_CONTAINER_IMAGE:-ubuntu:22.04}
    container_name: ${ORDS_STANDALONE_CONTAINER_NAME:-ords-standalone-dev}
    ports:
      - "${ORDS_STANDALONE_HTTP_PORT:-8085}:8080"
      - "${ORDS_STANDALONE_HTTPS_PORT:-8445}:8443"
    env_file:
      - .env
    environment:
      - DB_HOST=${APEX_DB_HOST:-db-apex-proxy}
      - DB_PORT=${APEX_DB_PORT:-1521}
      - DB_SERVICE=${APEX_DB_SERVICE:-FREEPDB1}
    volumes:
      - ./:/workspace:rw
      - apex_images:/opt/ords/apex:rw
    command: >
      /bin/bash -c "
      apt-get update >/dev/null 2>&1 &&
      apt-get install -y openjdk-17-jre-headless zip unzip wget curl ca-certificates >/dev/null 2>&1 &&
      chmod +x /workspace/scripts/internal/install-ords-standalone.sh &&
      /workspace/scripts/internal/install-ords-standalone.sh &&
      /opt/ords/bin/ords --config /etc/ords/config serve
      "

  # ---------------------------------------------------------------------------
  # 5. Containerized Web IDE (code-server + Oracle Developer Tools + CI/CD UI)
  # ---------------------------------------------------------------------------
  web-ide:
    profiles:
      - web-ide
    build:
      context: ./docker/web-ide
      args:
        ARTIFACTORY_REGISTRY: ${ARTIFACTORY_DOCKER_REGISTRY:-""}
    image: ${WEB_IDE_CONTAINER_IMAGE:-web-ide-image:latest}
    container_name: web-ide-dev
    ports:
      - "${WEB_IDE_HTTP_PORT:-8090}:8443"
      - "${WEB_IDE_HTTPS_PORT:-8449}:8443"
      - "${CICD_WEB_UI_PORT:-8091}:8091"
    env_file:
      - .env
    environment:
      - PWD=/workspace
      - TNS_ADMIN=/config/.oracle/tns_admin
      - JAVA_TOOL_OPTIONS=-Doracle.net.tns_admin=/config/.oracle/tns_admin
      - AUTH=none
      - PASSWORD=
    volumes:
      - ./:/workspace
      - ./config/tns_admin_container:/config/.oracle/tns_admin
      - web_ide_data:/config
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 6. Containerized Oracle Analytics Publisher (Pixel Perfect / BI Publisher)
  # ---------------------------------------------------------------------------
  publisher:
    profiles:
      - publisher
    image: ${PUBLISHER_CONTAINER_IMAGE:-oracle/analyticsserver:2025}
    container_name: ${PUBLISHER_CONTAINER_NAME:-oracle-publisher-dev}
    ports:
      - "${PUBLISHER_HTTP_PORT:-9502}:9502"
      - "${PUBLISHER_HTTPS_PORT:-9503}:9503"
    env_file:
      - .env
    environment:
      - BI_DOMAIN_NAME=${PUBLISHER_DOMAIN_NAME:-bi}
      - DB_HOST=${PUBLISHER_DB_HOST:-db-publisher}
      - DB_PORT=${PUBLISHER_DB_PORT:-1533}
      - DB_SERVICE=${PUBLISHER_DB_SERVICE:-FREEPDB1}
    volumes:
      - publisher_data:/u01/oracle/user_projects
    restart: unless-stopped

volumes:
  publisher_oradata:
  publisher_data:
  apex_proxy_oradata:
  apex_images:
  apex_proxy_data:
  web_ide_data:

secrets:

  publisher_db_sys_password:
    external: true
  apex_db_sys_password:
    external: true
  apex_schema_password:
    external: true
  ords_listener_password:
    external: true
  test_dev_password:
    external: true
  apex_admin_password:
    external: true
  test_web_password:
    external: true
