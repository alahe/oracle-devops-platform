version: '3.8'

services:
  pub-db:
    image: docker.io/gvenzl/oracle-free:full
    container_name: pub-db
    hostname: pub-db
    shm_size: 2g
    ports:
      - "1532:1521"
    environment:
      - ORACLE_PASSWORD_FILE=/run/secrets/oracle_pwd
      - ORACLE_SID=FREE
      - ORACLE_PDB=FREEPDB1
      - TNS_ADMIN=/opt/oracle/admin/FREE/wallet
      - CONFIGURE_TDE=true
      - ENCRYPT_TABLESPACES=ALL
    volumes:
      - pub_db_oradata:/opt/oracle/oradata
      - ./config/tns_admin:/opt/oracle/admin/FREE/wallet:rw
      - apex_images_26_1:/opt/oracle/apex_images
    secrets:
      - source: apex_db_sys_password
        target: oracle_pwd
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 3072M
    healthcheck:
      test:
        - CMD-SHELL
        - (echo "SELECT 'ALIVE' FROM DUAL;" | sqlplus -L -S / as sysdba 2>/dev/null | grep -q 'ALIVE') || (echo "SELECT 'ALIVE' FROM DUAL;" | sqlplus -L -S sys/@localhost:1521/FREEPDB1 as sysdba 2>/dev/null | grep -q 'ALIVE') || (nc -z localhost 1521 2>/dev/null) || exit 1
      interval: 10s
      timeout: 10s
      retries: 25
      start_period: 30s
    restart: unless-stopped

  ords-dev:
    image: container-registry.oracle.com/database/ords:latest
    container_name: ords-dev-oracle-latest
    ports:
      - "8088:8080"
      - "8448:8443"
    entrypoint:
      - /bin/bash
      - -c
      - |
        export ORACLE_PWD=$$(cat /run/secrets/oracle_pwd 2>/dev/null || cat /run/secrets/apex_db_sys_password)
        export APEX_LISTENER_PWD=$$(cat /run/secrets/ords_listener_password 2>/dev/null || cat /run/secrets/apex_schema_password)
        export APEX_REST_PWD=$$(cat /run/secrets/ords_listener_password 2>/dev/null || cat /run/secrets/apex_schema_password)
        mkdir -p /etc/ords/config/ssl
        [ -f /etc/ords/certs/localhost.crt ] && cp /etc/ords/certs/localhost.crt /etc/ords/config/ssl/cert.crt 2>/dev/null || true
        [ -f /etc/ords/certs/localhost.key ] && cp /etc/ords/certs/localhost.key /etc/ords/config/ssl/key.key 2>/dev/null || true
        ords --config /etc/ords/config config set standalone.static.path /opt/oracle/apex_images/images 2>/dev/null || true
        exec /usr/bin/docker-entrypoint.sh
    environment:
      - DBHOST=pub-db
      - DBPORT=1521
      - DBSERVICENAME=FREEPDB1
    secrets:
      - source: apex_db_sys_password
        target: oracle_pwd
      - ords_listener_password
    depends_on:
      pub-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
    volumes:
      - apex_images_26_1:/opt/oracle/apex_images:ro
      - ./config/ords/pub_db:/etc/ords/config:rw
      - ./config/certs:/etc/ords/certs:ro
    restart: unless-stopped


volumes:
  pub_db_oradata:
  apex_images_26_1:

secrets:
  apex_db_sys_password:
    external: true
  ords_listener_password:
    external: true
