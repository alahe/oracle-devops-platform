profile:
  id: forms-shared-wls
  name: forms-shared-wls
  description: "Shared WebLogic Domain running both Oracle Forms 14c and Analytics Publisher in a single container."
  type: middleware
  component: forms

forms:
  enabled: true
  mode: shared-wls
  version: "14.1.2"
  container_image: localhost/oracle-forms-publisher:14.1.2-2025
  container_name: app-forms-publisher
  hostname: fmw-shared-dev
  http_port: 9001
  https_port: 9002
  vnc_port: 6082
  admin_port: 7001
  admin_username: weblogic
  target_database: "db-publisher"
  rcu_prefix: "FORMS"
  memory_args: "-Xms1024m -Xmx2048m -XX:MetaspaceSize=512m -XX:MaxMetaspaceSize=1024m"
