profile:
  id: proxy-standard-oracle
  name: "APEX Proxy Standard (Oracle Registry)"
  description: "APEX Outbound Proxy database running on official Oracle Free DB 23ai container with ORDS and APEX enabled."
  functionality: proxy
  db_type: standard
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/free:latest
  workload_type: NONE
  admin_user: sys
  admin_role: SYSDBA
  default_service: FREEPDB1
  db_port: 1532
  wallet_required: false
  configure_tde: true
  encrypt_tablespaces: ALL
  kafka_bootstrap_servers: "localhost:9092"

components:
  ords:
    enabled: true
    container_name: oracle-ords-proxy
    service_name: ords-proxy
    container_image: container-registry.oracle.com/database/ords:latest
    download_url: "https://download.oracle.com/otn_software/java/ords/ords-latest.zip"
    local_dir: "ords"
    https_port: 8448
    http_port: 8088
    schema_alias: test_dev
  apex:
    enabled: true
    download_url: "https://download.oracle.com/otn_software/apex/apex_24.1.zip"
    local_dir: "apex"
    workspace: PROXY_WORKSPACE
    version: 24.1
  sqlcl:
    container_image: container-registry.oracle.com/database/sqlcl:latest

users:
  - username: sys
    role: SYSDBA
    wallet_alias: DB_APEX_PROXY_SYS
    color: "#E74C3C"
  - username: APEX_PROXY_SCHEMA
    role: NORMAL
    wallet_alias: DB_APEX_PROXY_SCHEMA
    color: "#2980B9"
  - username: TEST_DEV
    role: NORMAL
    ords_enabled: true
    ords_alias: test_dev
    roles: [DB_DEVELOPER_ROLE]
    wallet_alias: DB_TEST_DEV
    color: "#F39C12"
  - username: TEST_WEB_USER
    role: NORMAL
    wallet_alias: TEST_WEB_USER
    color: "#8E44AD"
