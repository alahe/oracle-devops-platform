profile:
  id: proxy-adb
  name: "APEX Proxy ADB (Oracle Registry)"
  description: "APEX Outbound Proxy database running on Oracle Autonomous Database Free container with ORDS and APEX enabled."
  functionality: proxy
  db_type: adb
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/adb-free:latest
  workload_type: ATP
  db_sid: FREE
  db_pdb: MYATP
  admin_user: admin
  admin_role: NORMAL
  default_service: MYATP_low.adb.oraclecloud.com
  db_port: 1532
  container_port: 1522
  wallet_required: true
  configure_tde: true
  encrypt_tablespaces: ALL
  kafka_bootstrap_servers: "localhost:9092"

components:
  ords:
    enabled: true
    container_name: oracle-ords-proxy
    service_name: ords-proxy
    container_image: container-registry.oracle.com/database/ords:latest
    download_url: "https://download.oracle.com/otn_software/java/ords/ords-latest.zip"
    local_dir: "ords"
    https_port: 8443
    http_port: 8088
    schema_alias: test_dev
  apex:
    enabled: true
    download_url: "https://download.oracle.com/otn_software/apex/apex_24.1.zip"
    local_dir: "apex"
    workspace: PROXY_WORKSPACE
    version: 24.1
  sqlcl:
    container_image: container-registry.oracle.com/database/sqlcl:latest

users:
  - username: admin
    role: NORMAL
    wallet_alias: ADMIN
    color: "#E74C3C"
  - username: APEX_PROXY_SCHEMA
    role: NORMAL
    wallet_alias: DB_APEX_PROXY_SCHEMA
    color: "#2980B9"
  - username: TEST_DEV
    role: NORMAL
    ords_enabled: true
    ords_alias: test_dev
    roles: [CONSOLE_DEVELOPER, DWROLE, RESOURCE, DB_DEVELOPER_ROLE]
    wallet_alias: DB_TEST_DEV
    color: "#F39C12"
  - username: TEST_WEB_USER
    role: NORMAL
    wallet_alias: TEST_WEB_USER
    color: "#8E44AD"
