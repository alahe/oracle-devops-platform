# ==============================================================================
# Database Profile: Oracle Forms 14c RCU & Application DB (Oracle Free 23ai)
# ==============================================================================

profile:
  id: db-forms-oracle
  name: db-forms-oracle
  description: "Dedicated database instance for Oracle Forms 14c WebLogic RCU schemas and application backend."
  functionality: forms
  db_type: standard
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/free:latest
  container_name: db-forms
  workload_type: NONE
  admin_user: sys
  admin_role: SYSDBA
  default_service: FREEPDB1
  db_port: 1534
  wallet_required: false
  configure_tde: true
  encrypt_tablespaces: ALL

components:
  forms:
    enabled: true
    container_name: app-forms
    http_port: 9001
    novnc_port: 6082
  ords:
    enabled: false
  apex:
    enabled: false

users:
  - username: DBA_ADMIN
    role: DBA
    alias_suffix: DBA_ADMIN
    color: "#2980B9"

  - username: FORMS_SCHEMA
    role: NORMAL
    roles: [DB_DEVELOPER_ROLE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: APP
    color: "#8E44AD"

  - username: USER_DEVELOPER
    role: NORMAL
    roles: [DB_DEVELOPER_ROLE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: DEV
    color: "#27AE60"

  - username: USER_APP
    role: NORMAL
    roles: [CONNECT, RESOURCE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: APP_USER
    color: "#F39C12"

  - username: USER_VIEWER
    role: VIEWER
    roles: [CONNECT, SELECT_CATALOG_ROLE]
    alias_suffix: VIEWER
    color: "#95A5A6"
