profile:
  id: db-proxy-gvenzl
  name: db-proxy-gvenzl
  description: "APEX Outbound Proxy database running on Gvenzl Oracle Free faststart container image."
  functionality: proxy
  db_type: standard
  image_vendor: gvenzl

database:
  container_image: docker.io/gvenzl/oracle-free:23-full-faststart
  workload_type: NONE
  admin_user: sys
  admin_role: SYSDBA
  default_service: FREEPDB1
  db_port: 1532
  wallet_required: false
  configure_tde: true
  encrypt_tablespaces: ALL
  kafka_bootstrap_servers: "localhost:9092"

components:
  ords:
    enabled: true
    version: "26.2.2"
    pool_name: "default"
    url_mapping: "/ords/proxy/"
    container_name: app-ords
    service_name: app-ords
    container_image: container-registry.oracle.com/database/ords:latest
    download_url: "https://download.oracle.com/otn_software/java/ords/ords-latest.zip"
    local_dir: "ords"
    https_port: 8448
    http_port: 8088
    schema_alias: test_dev
  apex:
    enabled: true
    download_url: "https://download.oracle.com/otn_software/apex/apex_26.1_en.zip"
    local_dir: "apex"
    workspace: PROXY_WORKSPACE
    version: "26.1"

users:
  - username: sys
    role: SYSDBA
    wallet_alias: DB_PROXY_SYS
    color: "#E74C3C"
  - username: DBA_ADMIN
    role: DBA
    wallet_alias: DB_PROXY_DBA_ADMIN
    color: "#2980B9"
  - username: APEX_PROXY_SCHEMA
    role: NORMAL
    wallet_alias: DB_PROXY_SCHEMA
    color: "#2980B9"
  - username: USER_DEVELOPER
    role: NORMAL
    ords_enabled: true
    ords_alias: user_developer
    roles: [DB_DEVELOPER_ROLE]
    wallet_alias: DB_PROXY_DEV
    color: "#F39C12"
  - username: USER_APP
    role: NORMAL
    roles: [RESOURCE]
    wallet_alias: DB_PROXY_APP
    color: "#27AE60"
  - username: USER_VIEWER
    role: READONLY
    roles: [CONNECT]
    wallet_alias: DB_PROXY_VIEWER
    color: "#8E44AD"
  - username: PUBLISHER_READER
    role: READONLY
    roles: [CONNECT, RESOURCE]
    wallet_alias: DB_PUBLISHER_READER
    color: "#9B59B6"
