profile:
  id: proxy-gvenzl
  name: proxy-gvenzl
  description: "APEX Outbound Proxy database running on Gerald Venzl Oracle Free 23c Faststart container with pre-installed ORDS/APEX."
  functionality: proxy
  db_type: standard
  image_vendor: gvenzl

database:
  container_image: docker.io/gvenzl/oracle-free:full
  workload_type: NONE
  admin_user: sys
  admin_role: SYSDBA
  default_service: FREEPDB1
  db_port: 1532
  wallet_required: false
  configure_tde: true
  encrypt_tablespaces: ALL
  kafka_bootstrap_servers: "localhost:9092"
  db_memory_limit: "3072M"

components:
  ords:
    enabled: true
    container_name: ords-dev-oracle-latest
    service_name: ords-dev
    container_image: container-registry.oracle.com/database/ords:latest
    download_url: "https://download.oracle.com/otn_software/java/ords/ords-latest.zip"
    local_dir: "ords"
    https_port: 8448
    http_port: 8088
    ords_memory_limit: "1024M"
    schema_alias: test_dev
  apex:
    enabled: true
    download_url: "https://download.oracle.com/otn_software/apex/apex_26.1_en.zip"
    local_dir: "apex"
    workspace: PROXY_WORKSPACE
    version: 26.1
  sqlcl:
    container_image: container-registry.oracle.com/database/sqlcl:latest

users:
  - username: sys
    role: SYSDBA
    wallet_alias: DB_APEX_PROXY_SYS
    color: "#E74C3C"
  - username: APEX_PROXY_SCHEMA
    role: NORMAL
    wallet_alias: DB_APEX_PROXY_SCHEMA
    color: "#2980B9"
  - username: TEST_DEV
    role: NORMAL
    ords_enabled: true
    ords_alias: test_dev
    roles: [DB_DEVELOPER_ROLE]
    wallet_alias: DB_TEST_DEV
    color: "#F39C12"
  - username: TEST_WEB_USER
    role: NORMAL
    wallet_alias: TEST_WEB_USER
    color: "#8E44AD"
