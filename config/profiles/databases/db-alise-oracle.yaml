profile:
  id: db-alise-oracle
  name: db-alise-oracle
  description: "Automated Legacy-to-cloud Integration & Schema Engine (ALISE) Application Database running on official Oracle Free DB 23ai image."
  functionality: app
  db_type: standard
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/free:latest
  workload_type: NONE
  admin_user: sys
  admin_role: SYSDBA
  default_service: FREEPDB1
  db_port: 1533
  wallet_required: false
  configure_tde: true
  encrypt_tablespaces: ALL
  kafka_bootstrap_servers: "localhost:9092"

components:
  ords:
    enabled: true
    version: "26.2.2"
    pool_name: "alise"
    url_mapping: "/ords/alise/"
    container_name: app-ords
    service_name: app-ords
    container_image: container-registry.oracle.com/database/ords:latest
    download_url: "https://download.oracle.com/otn_software/java/ords/ords-latest.zip"
    local_dir: "ords"
    https_port: 8448
    http_port: 8088
    schema_alias: alise_app
  apex:
    enabled: true
    download_url: "https://download.oracle.com/otn_software/apex/apex_26.1_en.zip"
    local_dir: "apex"
    workspace: ALISE_WORKSPACE
    version: "26.1"

users:
  - username: sys
    role: SYSDBA
    wallet_alias: DB_ALISE_SYS
    color: "#E74C3C"
  - username: DBA_ADMIN
    role: DBA
    wallet_alias: DB_ALISE_DBA_ADMIN
    color: "#2980B9"
  - username: ALISE_APP
    role: NORMAL
    ords_enabled: true
    ords_alias: alise_app
    roles: [DB_DEVELOPER_ROLE]
    wallet_alias: DB_ALISE_APP
    color: "#2980B9"
  - username: USER_DEVELOPER
    role: NORMAL
    ords_enabled: true
    ords_alias: dev_alise
    roles: [DB_DEVELOPER_ROLE]
    wallet_alias: DB_ALISE_DEV
    color: "#27AE60"
  - username: USER_APP
    role: NORMAL
    roles: [CONNECT, RESOURCE]
    wallet_alias: DB_ALISE_APP_USER
    color: "#F39C12"
  - username: USER_VIEWER
    role: VIEWER
    roles: [CONNECT]
    wallet_alias: DB_ALISE_VIEWER
    color: "#95A5A6"
