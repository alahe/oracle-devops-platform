# ==============================================================================
# Database Profile: Dedicated ALISE Business DB (db-alise-oracle)
# ==============================================================================
# Purpose: Primary business schemas, PL/SQL engine, and APEX running on port 1533.
# ==============================================================================

profile:
  id: db-alise-oracle
  name: db-alise-oracle
  description: "Dedicated Oracle Free DB 23ai ALISE Business Database container."
  functionality: standard
  db_type: standard                     # Options: standard | adb | gvenzl
  image_vendor: oracle                  # Options: oracle | gvenzl | custom

database:
  container_image: container-registry.oracle.com/database/free:latest
  container_name: db-alise
  workload_type: NONE                   # Workload type (OLTP, DW, NONE)
  admin_user: sys                       # Built-in superuser (automatically managed by engine)
  admin_role: SYSDBA
  default_service: FREEPDB1             # Target Pluggable Database (PDB) service name
  db_port: 1533                         # Standard ALISE host TCP listener port
  wallet_required: false                # Cloud mTLS wallet requirement
  configure_tde: true                   # Transparent Data Encryption enabled
  encrypt_tablespaces: ALL              # Tablespace encryption policy
  kafka_bootstrap_servers: "localhost:9092"
  db_memory_limit: "3072M"

database_features:
  apex:
    enabled: true                       # Install Oracle APEX Engine into PDB
    version: latest
    workspace: ALISE_WORKSPACE
  ords:
    enabled: true
    pool_name: alise

users:
  - username: DBA_ADMIN
    role: DBA
    alias_suffix: DBA_ADMIN
    color: "#2980B9"

  - username: APP_SCHEMA
    role: NORMAL
    roles: [DB_DEVELOPER_ROLE]
    tablespace: DATA
    quota: unlimited
    ords_enabled: true
    alias_suffix: APP
    color: "#2980B9"

  - username: USER_DEVELOPER
    role: NORMAL
    roles: [DB_DEVELOPER_ROLE]
    tablespace: DATA
    quota: unlimited
    ords_enabled: true
    alias_suffix: DEV
    color: "#27AE60"
