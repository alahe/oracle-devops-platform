# ==============================================================================
# Database Profile: Analytics Publisher RCU Database (Oracle Free 23ai)
# ==============================================================================

profile:
  id: db-publisher-oracle
  name: db-publisher-oracle
  description: "Dedicated BIPLATFORM & MDS RCU Repository database for Oracle Analytics Publisher."
  functionality: publisher
  db_type: standard
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/free:latest
  container_name: db-publisher
  workload_type: NONE
  admin_user: sys
  admin_role: SYSDBA
  default_service: FREEPDB1
  db_port: 1531
  wallet_required: false
  configure_tde: true
  encrypt_tablespaces: ALL

components:
  publisher:
    enabled: true
    container_name: app-publisher
    http_port: 9502
    https_port: 9503
  ords:
    enabled: false
  apex:
    enabled: false

users:
  - username: DBA_ADMIN
    role: DBA
    alias_suffix: DBA_ADMIN
    color: "#2980B9"

  - username: DEV_FULL
    role: NORMAL
    roles: [CONNECT, RESOURCE, DBA]
    tablespace: DATA
    quota: unlimited
    alias_suffix: DEV_FULL
    color: "#E67E22"

  - username: DEV_BIPLATFORM
    role: NORMAL
    roles: [CONNECT, RESOURCE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: BIPLATFORM
    color: "#E67E22"

  - username: USER_DEVELOPER
    role: NORMAL
    roles: [DB_DEVELOPER_ROLE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: DEV
    color: "#27AE60"

  - username: USER_APP
    role: NORMAL
    roles: [CONNECT, RESOURCE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: APP
    color: "#F39C12"

  - username: USER_VIEWER
    role: VIEWER
    roles: [CONNECT, SELECT_CATALOG_ROLE]
    alias_suffix: VIEWER
    color: "#95A5A6"

  - username: PUBLISHER_READER
    role: NORMAL
    roles: [CONNECT, RESOURCE]
    alias_suffix: PUB_READER
    color: "#8E44AD"
