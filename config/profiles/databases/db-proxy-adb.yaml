profile:
  id: db-proxy-adb
  name: db-proxy-adb
  description: "APEX Outbound Proxy running on Autonomous Database (Free / OCI ADB Free Tier)."
  functionality: proxy
  db_type: autonomous
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/adb-free:latest
  workload_type: OLTP
  admin_user: ADMIN
  admin_role: NORMAL
  default_service: MYATP_low
  db_port: 1532
  wallet_required: true

components:
  ords:
    enabled: true
    preinstalled: true
    container_required: false
    https_port: 8443
    http_port: 8080
  apex:
    enabled: true
    preinstalled: true
    install_required: false
    workspace: PROXY_WORKSPACE

users:
  - username: ADMIN
    role: ADMIN
    wallet_alias: DB_PROXY_SYS
    color: "#E74C3C"
  - username: APEX_PROXY_SCHEMA
    role: NORMAL
    wallet_alias: DB_PROXY_SCHEMA
    color: "#2980B9"
  - username: TEST_DEV
    role: NORMAL
    ords_enabled: true
    ords_alias: test_dev
    roles: [DB_DEVELOPER_ROLE]
    wallet_alias: DB_PROXY_DEV
    color: "#F39C12"
