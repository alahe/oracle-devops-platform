profile:
  id: db-proxy-adb
  name: db-proxy-adb
  description: "APEX Outbound Proxy running on Autonomous Database (Free / OCI ADB Free Tier)."
  functionality: proxy
  db_type: autonomous
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/adb-free:latest
  workload_type: OLTP
  admin_user: ADMIN
  admin_role: NORMAL
  default_service: FREEPDB1
  db_port: 1532
  wallet_required: true

components:
  ords:
    enabled: true
    preinstalled: true
    container_required: true
    https_port: 8448
    http_port: 8088
    pool_name: "proxy"
    url_mapping: "/ords/proxy/"
  apex:
    enabled: true
    preinstalled: true
    install_required: false
    workspace: PROXY_WORKSPACE

users:
  - username: ADMIN
    role: ADMIN
    wallet_alias: DB_PROXY_SYS
    color: "#E74C3C"
  - username: ADMIN
    role: ADMIN
    wallet_alias: DB_PROXY_APEX_ADMIN
    color: "#E74C3C"
  - username: DBA_ADMIN
    role: DBA
    wallet_alias: DB_PROXY_DBA_ADMIN
    color: "#2980B9"
  - username: APEX_PROXY_SCHEMA
    role: NORMAL
    wallet_alias: DB_PROXY_SCHEMA
    color: "#2980B9"
  - username: USER_DEVELOPER
    role: NORMAL
    ords_enabled: true
    ords_alias: user_developer
    roles: [DB_DEVELOPER_ROLE]
    wallet_alias: DB_PROXY_DEV
    color: "#F39C12"
  - username: USER_APP
    role: NORMAL
    roles: [RESOURCE]
    wallet_alias: DB_PROXY_APP
    color: "#27AE60"
  - username: USER_VIEWER
    role: READONLY
    roles: [CONNECT]
    wallet_alias: DB_PROXY_VIEWER
    color: "#8E44AD"
