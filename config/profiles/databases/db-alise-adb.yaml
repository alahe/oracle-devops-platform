profile:
  id: db-alise-adb
  name: db-alise-adb
  description: "Automated Legacy-to-cloud Integration & Schema Engine (ALISE) Application Database running on Autonomous Database (Free / OCI ADB Free Tier)."
  functionality: app
  db_type: autonomous
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/adb-free:latest
  workload_type: OLTP
  admin_user: ADMIN
  admin_role: NORMAL
  default_service: FREEPDB1
  db_port: 1533
  wallet_required: true

components:
  ords:
    enabled: true
    preinstalled: true
    container_required: true
    https_port: 8448
    http_port: 8088
    pool_name: "alise"
    url_mapping: "/ords/alise/"
  apex:
    enabled: true
    preinstalled: true
    install_required: false
    workspace: ALISE_WORKSPACE

users:
  - username: ADMIN
    role: ADMIN
    wallet_alias: DB_ALISE_SYS
    color: "#E74C3C"
  - username: ALISE_APP
    role: NORMAL
    ords_enabled: true
    ords_alias: alise_app
    roles: [DB_DEVELOPER_ROLE]
    wallet_alias: DB_ALISE_APP
    color: "#2980B9"
