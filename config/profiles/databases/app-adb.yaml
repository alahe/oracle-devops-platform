profile:
  id: app-adb
  name: app-adb
  description: "General purpose Primary Application database running on Oracle Autonomous Database Free container."
  functionality: app
  db_type: adb
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/adb-free:latest
  workload_type: ATP
  admin_user: admin
  admin_role: NORMAL
  default_service: MYATP_low.adb.oraclecloud.com
  db_port: 1533
  wallet_required: true
  configure_tde: true
  encrypt_tablespaces: ALL
  kafka_bootstrap_servers: "localhost:9092"

components:
  ords:
    enabled: true
    container_name: oracle-ords-app
    service_name: ords-app
    container_image: container-registry.oracle.com/database/ords:latest
    download_url: "https://download.oracle.com/otn_software/java/ords/ords-latest.zip"
    local_dir: "ords"
    https_port: 8443
    http_port: 8088
    schema_alias: app_dev
  apex:
    enabled: false
  sqlcl:
    container_image: container-registry.oracle.com/database/sqlcl:latest

users:
  - username: admin
    role: NORMAL
    wallet_alias: ADMIN
    color: "#E74C3C"
  - username: APP_SCHEMA
    role: NORMAL
    wallet_alias: DB_APP_SCHEMA
    color: "#2980B9"
  - username: APP_DEV
    role: NORMAL
    ords_enabled: true
    ords_alias: app_dev
    roles: [CONSOLE_DEVELOPER, DWROLE, RESOURCE, DB_DEVELOPER_ROLE]
    wallet_alias: DB_APP_DEV
    color: "#F39C12"
