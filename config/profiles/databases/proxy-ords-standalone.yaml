profile:
  id: proxy-ords-standalone
  name: proxy-ords-standalone
  description: "Oracle AI Database 26ai Free configured with dedicated Podman Standalone ORDS service running on non-colliding ports 8085/8445."
  type: database

database:
  container_name: db-apex-proxy
  container_image: container-registry.oracle.com/database/free:latest
  ports:
    db_port: 1521
    tcps_port: 2484
  service_name: FREEPDB1

ords:
  enabled: true
  mode: standalone
  container_name: ords-standalone-dev
  service_name: standalone-ords
  container_image: ubuntu:22.04
  http_port: 8085
  https_port: 8445

users:
  - username: SYS
    role: SYSDBA
    wallet_alias: DB_APEX_PROXY_SYS
  - username: APEX_PROXY_SCHEMA
    role: SCHEMA
    wallet_alias: DB_APEX_PROXY_SCHEMA
  - username: TEST_DEV
    role: DEVELOPER
    wallet_alias: DB_TEST_DEV
  - username: TEST_WEB_USER
    role: WEB_USER
    wallet_alias: TEST_WEB_USER
