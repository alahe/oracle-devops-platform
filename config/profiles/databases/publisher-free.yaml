profile:
  id: publisher-free
  name: publisher-free
  description: "Dedicated Oracle Database & Analytics Publisher (Pixel Perfect) with RCU schemas and ORDS REST management."
  functionality: appinfra
  db_type: standard
  image_vendor: gvenzl

database:
  container_image: docker.io/gvenzl/oracle-free:23-full-faststart
  workload_type: NONE
  admin_user: sys
  admin_role: SYSDBA
  default_service: FREEPDB1
  db_port: 1533
  wallet_required: false
  configure_tde: true
  encrypt_tablespaces: ALL

components:
  ords:
    enabled: true
    container_name: oracle-ords-publisher
    service_name: ords-publisher
    http_port: 8089
    https_port: 8449
  apex:
    enabled: false
  publisher:
    enabled: true
    container_name: oracle-publisher-dev
    http_port: 9502
    https_port: 9503
    rcu_prefix: OAS
    domain_name: bi
    admin_user: weblogic
  sqlcl:
    container_image: container-registry.oracle.com/database/sqlcl:latest

users:
  - username: sys
    role: SYSDBA
    wallet_alias: DB_PUBLISHER_SYS
    color: "#27AE60"
  - username: OAS_CONFIG
    role: NORMAL
    wallet_alias: DB_OAS_CONFIG
    color: "#27AE60"
