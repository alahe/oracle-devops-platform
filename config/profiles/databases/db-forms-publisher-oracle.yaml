# ==============================================================================
# Database Profile: Consolidated Forms 14c & Analytics Publisher RCU DB (23ai Free)
# ==============================================================================

profile:
  id: db-forms-publisher-oracle
  name: db-forms-publisher-oracle
  description: "Dedicated consolidated RCU repository database for Oracle Forms 14c and Analytics Publisher unified WebLogic domain."
  functionality: forms-publisher
  db_type: standard
  image_vendor: oracle

database:
  container_image: container-registry.oracle.com/database/free:latest
  container_name: db-forms-publisher
  workload_type: NONE
  admin_user: sys
  admin_role: SYSDBA
  default_service: FREEPDB1
  db_port: 1538
  wallet_required: false
  configure_tde: true
  encrypt_tablespaces: ALL

components:
  forms_publisher:
    enabled: true
    container_name: app-forms-publisher
    http_port: 9005
    https_port: 9006
    publisher_http_port: 9505
    publisher_https_port: 9506
    vnc_port: 6085
    admin_port: 7005
  ords:
    enabled: false
  apex:
    enabled: false

users:
  - username: DBA_ADMIN
    role: DBA
    alias_suffix: DBA_ADMIN
    color: "#2980B9"

  - username: DEV_FULL
    role: NORMAL
    roles: [CONNECT, RESOURCE, DBA]
    tablespace: DATA
    quota: unlimited
    alias_suffix: DEV_FULL
    color: "#E67E22"

  - username: FORMS_SCHEMA
    role: NORMAL
    roles: [DB_DEVELOPER_ROLE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: APP_FORMS
    color: "#8E44AD"

  - username: DEV_BIPLATFORM
    role: NORMAL
    roles: [CONNECT, RESOURCE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: BIPLATFORM
    color: "#E67E22"

  - username: USER_DEVELOPER
    role: NORMAL
    roles: [DB_DEVELOPER_ROLE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: DEV
    color: "#27AE60"

  - username: USER_APP
    role: NORMAL
    roles: [CONNECT, RESOURCE]
    tablespace: DATA
    quota: unlimited
    alias_suffix: APP
    color: "#16A085"
